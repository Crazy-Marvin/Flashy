plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    defaultConfig {
        applicationId "rocks.poopjournal.flashy"
        minSdk 23
        targetSdk 36
        versionCode 33
        versionName "3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        resConfigs "en", "cs", "de", "es", "hr", "lt", "nb-rNO", "pt", "pt-rBR", "ru", "sat", "tr", "zh-rCN"

    }
    base {
        archivesName = "Flashy-${android.defaultConfig.versionName}"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace  = 'rocks.poopjournal.flashy'
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    coreLibraryDesugaring ('com.android.tools:desugar_jdk_libs:2.1.5')
    implementation "com.github.skydoves:colorpickerview:2.4.0"

    implementation 'me.tankery.lib:circularSeekBar:1.4.2'
    //to resolve dependency conflicts
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
}
