plugins {
    id 'com.android.application'
}

def appVersionName = '3.5'

android {
    namespace = 'rocks.poopjournal.flashy'
    compileSdk = 37

    defaultConfig {
        applicationId = "rocks.poopjournal.flashy"
        minSdk = 23
        targetSdk = 37
        versionCode = 35
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }
    androidResources {
        // Replaces the removed defaultConfig.resConfigs
        localeFilters += ["en", "cs", "de", "es", "hr", "lt", "nb-rNO", "pt", "pt-rBR", "ru", "sat", "tr", "zh-rCN"]
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        // Free Software builds (F-Droid, IzzyOnDroid, ...). These must not depend on the
        // proprietary Nothing Glyph SDK, which is neither Free Software nor published to a
        // public Maven repository, so this flavour leaves app/libs out and uses the stub
        // GlyphHelper in src/fdroid instead.
        fdroid {
            dimension "distribution"
        }
        // Everything that may ship the Glyph SDK, i.e. the Google Play build.
        full {
            dimension "distribution"
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility to Java 8
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

base {
    archivesName = "Flashy-$appVersionName"
}

dependencies {
    // Includes libs/glyph-matrix-sdk-2.0.aar, the Nothing Glyph SDK. Only the `full` flavour
    // gets it: the Glyph SDK is proprietary and not on any public Maven repository, so the
    // `fdroid` flavour has to build without it (see src/fdroid/.../GlyphHelper.java).
    fullImplementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.github.skydoves:colorpickerview:2.5.0'

    implementation 'me.tankery.lib:circularSeekBar:1.4.2'
    //to resolve dependency conflicts
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
}
